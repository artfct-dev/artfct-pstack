name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Unit tests
        run: bun test skills/publish-evidence/tests/
      - name: Typecheck extension
        run: bun x --package typescript -- tsc --noEmit -p tsconfig.json
      - name: Validate manifests
        run: bun -e 'for (const f of ["plugin.json","package.json"]) { const m = await Bun.file(f).json(); if (!m.name) throw new Error(f); } console.log("manifests ok")'
      - name: Version bump covers release changes
        if: github.event_name == 'pull_request'
        run: bun scripts/version-guard.ts "origin/${{ github.base_ref }}"
